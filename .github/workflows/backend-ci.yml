name: Backend CI

# Run on every branch push and on pull request activity.
# The shared branch is currently feature/ai-intake-pipeline, so no main/master
# branch is assumed.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Least-privilege permissions: this workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  backend:
    name: Lint and syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Display Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Run ESLint
        run: npm run lint

      - name: Validate JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r -n 1 node --check

      # Automated tests are intentionally not run yet. The repository's current
      # test script is only a placeholder that exits with code 1, so executing
      # it would provide a false CI signal. Tests will be added during QA.
